[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "makelive"
authors = [{ name = "Rhet Turnbull", email = "rturnbull+git@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
requires-python = ">3.9"
dependencies = [
    "cgmetadata>=0.1.6",
    "click>=8.0.0",
    "piexif>=1.1.3",
    "pyobjc-core>=9.2",
    "pyobjc-framework-AVFoundation>=9.2",
    "pyobjc-framework-Cocoa>=9.2",
    "pyobjc-framework-Contacts>=9.2",
    "pyobjc-framework-CoreLocation>=9.2",
    "pyobjc-framework-Photos>=9.2",
    "pyobjc-framework-Quartz>=9.2",
    "wheel>=0.41.2",
    "wurlitzer>=3.0.3",
]

[project.optional-dependencies]
test = ["pytest>=7.4.2", "pytest-cov", "mypy>=1.6.1"]
lint = ["ruff>=0.1.14"]
dev = ["applecrate>=0.2.0", "bump2version==1.0.1"]
app = ["py2app>=0.28"]

# docs = [
#     "mkdocs>=1.4.2",
#     "mkdocs-material>=9.0.13",
#     "mkdocstrings-python>=0.8.3",
# ]

[project.urls]
Home = "https://github.com/RhetTbull/makelive"
Issues = "https://github.com/RhetTbull/makelive/issues"
Source = "https://github.com/RhetTbull/makelive"


[project.scripts]
makelive = "makelive.__main__:main"

[project.gui-scripts]
makelive-gui = "makelive_gui.app:run"

[tool.flit.sdist]
exclude = ["site/**/*", "tests/**/*"]

# Used only when running py2app via setup.py (Flit is the real build backend).
[tool.setuptools.dynamic]
version = { attr = "makelive.version.__version__" }
description = { file = "DESCRIPTION.txt" }

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 130
